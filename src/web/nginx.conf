# nginx.conf — configuración del servidor web para el frontend.
# Sirve los archivos estáticos de React y redirige las peticiones /api hacia FastAPI.

server {
    listen 80;
    server_name _;

    # Directorio donde se encuentran los archivos compilados de Vite.
    root /usr/share/nginx/html;
    index index.html;

    # Redirige las peticiones de la API al servicio api de Docker Compose.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Permite que React gestione las rutas de la aplicación.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
